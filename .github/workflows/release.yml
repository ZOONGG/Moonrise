name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Test and publish tagged Windows release
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Resolve release version
        id: version
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace "^v", ""
          $version = ($tagVersion -split "-", 2)[0]
          if ($version -notmatch "^\d+\.\d+\.\d+$") {
            throw "Release tags must start with v<major>.<minor>.<patch>."
          }
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Scan repository safety
        shell: pwsh
        env:
          MOONRISE_PRIVATE_PATTERNS: ${{ secrets.PRIVATE_NAME_PATTERNS }}
        run: ./tools/Test-RepositorySafety.ps1

      - name: Restore locked dependencies
        run: dotnet restore Moonrise.sln --locked-mode

      - name: Build Release
        run: dotnet build Moonrise.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test Moonrise.sln -c Release --no-build --logger "trx;LogFileName=moonrise.trx" --results-directory artifacts/test-results

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build Setup and Portable release
        shell: pwsh
        run: |
          ./tools/New-MoonriseRelease.ps1 `
            -Version "${{ steps.version.outputs.version }}" `
            -OutputRoot "artifacts/release" `
            -SkipRestore `
            -SkipTests

      - name: Test installer lifecycle
        shell: pwsh
        run: |
          ./tools/Test-MoonriseInstaller.ps1 `
            -SetupPath "artifacts/release/Moonrise-Setup-${{ steps.version.outputs.version }}-x64.exe" `
            -LaunchSmokeTest `
            -TestUserDataDeletion

      - name: Upload installer artifacts for CI testing
        uses: actions/upload-artifact@v7
        with:
          name: Moonrise-Windows-${{ steps.version.outputs.version }}
          path: |
            artifacts/release/Moonrise-Setup-*
            artifacts/release/Moonrise-Portable-*
            artifacts/release/Moonrise-Release-Notes-*
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/RELEASE_NOTES.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          overwrite_files: true
          files: |
            artifacts/release/Moonrise-Setup-${{ steps.version.outputs.version }}-x64.exe
            artifacts/release/Moonrise-Setup-${{ steps.version.outputs.version }}-x64.exe.sha256
            artifacts/release/Moonrise-Portable-${{ steps.version.outputs.version }}-x64.zip
            artifacts/release/Moonrise-Portable-${{ steps.version.outputs.version }}-x64.zip.sha256
            artifacts/release/Moonrise-Release-Notes-${{ steps.version.outputs.version }}.md

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Moonrise-release-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error
          retention-days: 30
