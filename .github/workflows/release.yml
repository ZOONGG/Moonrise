name: Prepare manual release assets

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages

jobs:
  build:
    name: Prepare manual release assets, test, and Velopack package
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Scan repository safety
        shell: pwsh
        env:
          MOONRISE_PRIVATE_PATTERNS: ${{ secrets.PRIVATE_NAME_PATTERNS }}
        run: ./tools/Test-RepositorySafety.ps1

      - name: Verify native bridge builds from source
        shell: pwsh
        run: ./tools/Build-NativeBridge.ps1 -OutputPath "artifacts/native/Moonrise.Native.dll"

      - name: Upload native bridge verification artifact
        uses: actions/upload-artifact@v7
        with:
          name: Moonrise-Native-Bridge-${{ github.run_number }}
          path: artifacts/native/Moonrise.Native.dll
          if-no-files-found: error
          retention-days: 7
      - name: Restore locked dependencies
        run: dotnet restore Moonrise.sln --locked-mode

      - name: Prepare manual release assets Release
        run: dotnet build Moonrise.sln -c Release --no-restore

      - name: Run tests
        run: dotnet test Moonrise.sln -c Release --no-build --filter "Category!=PrivateAssets" --logger "trx;LogFileName=moonrise.trx" --results-directory artifacts/test-results

      - name: Install pinned Velopack
        shell: pwsh
        run: dotnet tool install vpk --version 1.2.161 --tool-path artifacts/velopack-tools

      - name: Prepare manual release assets Setup and Portable artifacts
        shell: pwsh
        run: |
          ./tools/New-MoonriseRelease.ps1 `
            -Version "0.1.0-beta.1" `
            -OutputRoot "artifacts/release" `
            -Velopack -VpkPath artifacts/velopack-tools/vpk.exe `
            -SkipRestore `
            -SkipTests

      - name: Upload Windows distribution artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Moonrise-Windows-${{ github.run_number }}
          path: artifacts/release/velopack/*
          if-no-files-found: error
          retention-days: 14

      - name: Test isolated Velopack install and launch
        shell: pwsh
        run: ./tools/Test-MoonriseVelopackInstaller.ps1 -SetupPath artifacts/release/velopack/Moonrise.App-beta-Setup.exe

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Moonrise-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: error
          retention-days: 14
