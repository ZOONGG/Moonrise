name: Project-aware support client check

on:
  push:
    branches:
      - chore/project-aware-support-api

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - run: dotnet restore Moonrise.sln
      - run: dotnet build Moonrise.sln -c Release --no-restore
      - run: dotnet test Moonrise.sln -c Release --no-build --filter "FullyQualifiedName!~Stage1RecoveryTests"
