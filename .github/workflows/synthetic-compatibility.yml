name: Synthetic Lunar compatibility

on:
  pull_request:
    branches:
      - test/mnr4-runtime-candidate-v2
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  public-tests:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Scan repository safety
        shell: pwsh
        env:
          MOONRISE_PRIVATE_PATTERNS: ${{ secrets.PRIVATE_NAME_PATTERNS }}
        run: ./tools/Test-RepositorySafety.ps1
      - name: Restore locked dependencies
        run: dotnet restore Moonrise.sln --locked-mode
      - name: Build Release
        run: dotnet build Moonrise.sln -c Release --no-restore
      - name: Run all public tests (synthetic files, no Lunar or Minecraft)
        run: dotnet test Moonrise.sln -c Release --no-build --filter "Category!=PrivateAssets" --logger "trx;LogFileName=public-tests.trx" --results-directory artifacts/test-results
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: synthetic-compatibility-test-results
          path: artifacts/test-results/*.trx
          if-no-files-found: warn
          retention-days: 7
