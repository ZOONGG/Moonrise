name: Shared Support Test Build

on:
  push:
    branches:
      - build/shared-support-ltc-doge-test

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore
        run: dotnet restore Moonrise.sln
      - name: Build
        run: dotnet build Moonrise.sln -c Release --no-restore
      - name: Test
        run: dotnet test Moonrise.sln -c Release --no-build --filter "FullyQualifiedName!~Stage1RecoveryTests"
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Create release artifacts
        shell: powershell
        run: |
          $version = "0.0.${{ github.run_number }}"
          ./tools/New-MoonriseRelease.ps1 -Version $version -Configuration Release -Runtime win-x64 -SkipRestore -SkipTests
      - name: Installer smoke
        shell: powershell
        run: |
          $setup = Get-ChildItem -Path artifacts/release -Filter "*Setup*.exe" | Select-Object -First 1
          if (-not $setup) { throw "Setup executable not found" }
          & $setup.FullName /VERYSILENT /SUPPRESSMSGBOXES /NORESTART /SP- /DIR="$env:RUNNER_TEMP\MoonriseSmoke"
          $exe = Join-Path "$env:RUNNER_TEMP\MoonriseSmoke" "Moonrise.exe"
          if (-not (Test-Path $exe)) { throw "Installed Moonrise.exe not found" }
          & $exe -LaunchSmokeTest
          if ($LASTEXITCODE -ne 0) { throw "Launch smoke test failed with $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: Moonrise-Shared-Support-Test-${{ github.run_number }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*Setup*.exe
            artifacts/release/*.sha256
          retention-days: 7
