name: Shared Support Test Build

on:
  push:
    branches:
      - build/shared-support-ltc-doge-test

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Restore
        run: dotnet restore Moonrise.sln
      - name: Build
        run: dotnet build Moonrise.sln -c Release --no-restore
      - name: Test
        run: dotnet test Moonrise.sln -c Release --no-build --filter "FullyQualifiedName!~Stage1RecoveryTests"
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Create release artifacts
        shell: pwsh
        run: |
          $version = "0.0.${{ github.run_number }}"
          ./tools/New-MoonriseRelease.ps1 -Version $version -OutputRoot "artifacts/release" -SkipRestore -SkipTests
      - name: Installer smoke
        shell: pwsh
        run: |
          ./tools/Test-MoonriseInstaller.ps1 `
            -SetupPath "artifacts/release/Moonrise-Setup-0.0.${{ github.run_number }}-x64.exe" `
            -LaunchSmokeTest
      - uses: actions/upload-artifact@v4
        with:
          name: Moonrise-Shared-Support-Test-${{ github.run_number }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*Setup*.exe
            artifacts/release/*.sha256
          retention-days: 7
